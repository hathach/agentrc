name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        # shards sized so each job's test step stays under a minute
        include:
          - {os: ubuntu-24.04, shard: 0, shards: 3}
          - {os: ubuntu-24.04, shard: 1, shards: 3}
          - {os: ubuntu-24.04, shard: 2, shards: 3}
          - {os: windows-2022, shard: 0, shards: 8}
          - {os: windows-2022, shard: 1, shards: 8}
          - {os: windows-2022, shard: 2, shards: 8}
          - {os: windows-2022, shard: 3, shards: 8}
          - {os: windows-2022, shard: 4, shards: 8}
          - {os: windows-2022, shard: 5, shards: 8}
          - {os: windows-2022, shard: 6, shards: 8}
          - {os: windows-2022, shard: 7, shards: 8}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # test_hil_lock's cross-version rows read hil_lock.py as older helpers run it (POSIX-only module)
      - if: runner.os == 'Linux'
        run: git fetch --no-tags --depth=1 origin 9e41f6fc89375df73d453c45e4c5a97103830fcd
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: python -m pip install pyyaml pre-commit pytest==9.1.1 pytest-xdist==3.8.0
      # an environment of its own: MSYS2's poppler brings a Python that would shadow this one on PATH
      - if: runner.os == 'Windows'
        id: poppler
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\poppler
          key: poppler-${{ runner.os }}-v1
      - if: runner.os == 'Windows' && steps.poppler.outputs.cache-hit != 'true'
        run: '& "$env:CONDA\Scripts\conda.exe" create -y -q -p "$env:RUNNER_TEMP\poppler" -c conda-forge poppler'
      - if: runner.os == 'Windows'
        run: '"$env:RUNNER_TEMP\poppler\Library\bin" >> $env:GITHUB_PATH'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq poppler-utils
      # proves the usb-sniffer AppArmor profile lifts Ubuntu's userns restriction, so its namespace tests run here
      - if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          if unshare --user --map-root-user --mount true; then echo "restriction not in effect"; exit 1; fi
          sudo apparmor_parser -r skills/usb-sniffer/scripts/usb-sniffer-unshare.apparmor
          unshare --user --map-root-user --mount true
      - name: optional tools found
        run: python -c "import shutil; [print(t, shutil.which(t)) for t in 'python node git bash jq awk pdfinfo pdftotext tshark editcap capinfos openocd kicad-cli xvfb-run pre-commit'.split()]"
      - run: python -X utf8 -m pytest -n 8 --dist worksteal -p no:cacheprovider --durations=20 --shard ${{ matrix.shard }}/${{ matrix.shards }} tests
