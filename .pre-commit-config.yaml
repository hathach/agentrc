repos:
  - repo: local
    hooks:
      - id: skill-tests
        name: skill-tests
        entry: python -X utf8 -m pytest -n 8 --dist worksteal -p no:cacheprovider -q tests
        pass_filenames: false
        always_run: true
        language: python
        additional_dependencies: [pyyaml, pytest==9.1.1, pytest-xdist==3.8.0]
