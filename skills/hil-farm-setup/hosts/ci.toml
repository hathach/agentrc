# ci.lan (VM 100 on pve): the TinyUSB, TinyUF2, Arduino TinyUSB and nRF52 bootloader HIL farm, the host alone.
profile = "ci"      # this host's name; a host keeps it, so a mistaken file refuses
admin = "hathach"   # the admin account: SSH key only and passwordless sudo on a dedicated host

[runner.tinyusb]  # one table per runner: its name and labels on GitHub
name = "tinyusb"
labels = ["hardware-in-the-loop", "hathach"]

[runner.tinyuf2]
name = "tinyuf2"
labels = ["tinyuf2"]

[runner.arduino-tinyusb]
name = "arduino-tinyusb"
labels = ["arduino-tinyusb"]

[runner.nrf52-bootloader]
name = "nrf52-bootloader"
labels = ["nrf52-bootloader"]
